name: PR Labeler

# Manual only: labels one pull request from the paths it changes.
# Start it with `just gh-labels <pr>`
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to label"
        type: number
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          pr-number: ${{ inputs.pr }}
          sync-labels: true
