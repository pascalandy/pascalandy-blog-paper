name: PR Labeler

# Manual only: labels one pull request from the paths it changes.
# Start it with `just gh-labels <pr>`
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to label"
        type: number
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          pr-number: ${{ inputs.pr }}
          sync-labels: true
