name: CI

on:
  push:
    branches: [main]
    # Pushes that cannot change the site skip the check and the deploy
    paths-ignore:
      - "*.md"
      - "!src/**/*.md"
      - "LICENSE"
      - ".vscode/**"
      - ".github/*.md"
      - "dev_notes/**"
  # Every pull request, whatever its base branch, so stacked PRs get a verdict
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same verdict as `just check` on any machine
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      JUST_VERSION: "1.50.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"

      - name: Cache Astro build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            cache
            !cache/check
          key: astro-cache-${{ runner.os }}-${{ hashFiles('src/assets/**/*', 'astro.config.ts', 'src/config.ts') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Check
        run: uvx --from "rust-just@$JUST_VERSION" just check

  deploy:
    name: Deploy in Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: {}
    steps:
      - uses: sevalla-hosting/sevalla-deploy@cea78040bda96fa24be11ef35458e1b4f7646bfa # v1.0.1
        with:
          action: deploy-static-site
          sevalla-token: ${{ secrets.SEVALLA_TOKEN }}
          static-site-id: ${{ vars.SEVALLA_STATIC_SITE_ID }}
          branch: main
          wait-for-finish: true

  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: check
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview')
    permissions:
      pull-requests: write
    steps:
      - uses: sevalla-hosting/sevalla-deploy@cea78040bda96fa24be11ef35458e1b4f7646bfa # v1.0.1
        with:
          action: deploy-static-site
          sevalla-token: ${{ secrets.SEVALLA_TOKEN }}
          static-site-id: ${{ vars.SEVALLA_STATIC_SITE_ID_PREVIEW }}
          branch: ${{ github.head_ref }}
          wait-for-finish: true

      - name: Comment PR with preview URL
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HEAD_REF: ${{ github.head_ref }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployment triggered on Sevalla!\n\nBranch: \`${process.env.HEAD_REF}\``
            })
