name: CI

# Manual only: `just signoff` is the PR gate, and a person ships main.
# Start a run with `just gh-ci [ref] [deploy]`
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "After the checks pass, deploy this ref to Sevalla (production takes main only)"
        type: choice
        options:
          - none
          - preview
          - production
        default: none

permissions: {}

jobs:
  # The same verdict as `just check` on any machine
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      JUST_VERSION: "1.50.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"

      - name: Cache Astro build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            cache
            !cache/check
            !cache/data-store.json
          key: astro-cache-${{ runner.os }}-${{ hashFiles('src/assets/**/*', 'astro.config.ts', 'src/config.ts') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Check
        run: uvx --from "rust-just@$JUST_VERSION" just check

  deploy:
    name: Deploy in Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: check
    if: inputs.deploy == 'production'
    permissions: {}
    steps:
      # The deploy below always ships main, so checks on another ref prove nothing about it
      - name: Refuse a ref other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::production deploys only main, not $GITHUB_REF_NAME"
          exit 1

      - uses: sevalla-hosting/sevalla-deploy@cea78040bda96fa24be11ef35458e1b4f7646bfa # v1.0.1
        with:
          action: deploy-static-site
          sevalla-token: ${{ secrets.SEVALLA_TOKEN }}
          static-site-id: ${{ vars.SEVALLA_STATIC_SITE_ID }}
          branch: main
          wait-for-finish: true

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: check
    if: inputs.deploy == 'preview'
    permissions: {}
    steps:
      - uses: sevalla-hosting/sevalla-deploy@cea78040bda96fa24be11ef35458e1b4f7646bfa # v1.0.1
        with:
          action: deploy-static-site
          sevalla-token: ${{ secrets.SEVALLA_TOKEN }}
          static-site-id: ${{ vars.SEVALLA_STATIC_SITE_ID_PREVIEW }}
          branch: ${{ github.ref_name }}
          wait-for-finish: true

      - name: Summarize
        run: echo "🚀 Preview deployed on Sevalla from \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
