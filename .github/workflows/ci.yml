name: CI

# Manual only: `just signoff` is the PR gate, and a person ships main.
# Start a run with `just gh-ci [ref] [deploy]`
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "After the checks pass, deploy this ref to Sevalla (production takes main only)"
        type: choice
        options:
          - none
          - preview
          - production
        default: none

permissions:
  contents: read

jobs:
  # Parallel quality checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          cache: true

      - run: bun install --frozen-lockfile
      - run: bun run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          cache: true

      - run: bun install --frozen-lockfile
      - run: bun run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          cache: true

      - run: bun install --frozen-lockfile
      - run: bun astro check

  # Build depends on all checks passing
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, format, typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          cache: true

      - name: Cache Astro build artifacts
        uses: actions/cache@v4
        with:
          path: cache
          key: astro-cache-${{ runner.os }}-${{ hashFiles('src/assets/**/*', 'astro.config.ts', 'src/config.ts') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build:ci

  deploy:
    name: Deploy in Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: inputs.deploy == 'production'
    steps:
      # The deploy below always ships main, so checks on another ref prove nothing about it
      - name: Refuse a ref other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::production deploys only main, not $GITHUB_REF_NAME"
          exit 1

      - uses: sevalla-hosting/sevalla-deploy@v1.0.1
        with:
          action: deploy-static-site
          sevalla-token: ${{ secrets.SEVALLA_TOKEN }}
          static-site-id: ${{ vars.SEVALLA_STATIC_SITE_ID }}
          branch: main
          wait-for-finish: true

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: inputs.deploy == 'preview'
    steps:
      - uses: sevalla-hosting/sevalla-deploy@v1.0.1
        with:
          action: deploy-static-site
          sevalla-token: ${{ secrets.SEVALLA_TOKEN }}
          static-site-id: ${{ vars.SEVALLA_STATIC_SITE_ID_PREVIEW }}
          branch: ${{ github.ref_name }}
          wait-for-finish: true

      - name: Summarize
        run: echo "🚀 Preview deployed on Sevalla from \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
