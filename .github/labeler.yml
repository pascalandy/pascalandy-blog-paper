# Astro/TypeScript project labeler config
# Docs: https://github.com/actions/labeler

content:
  - changed-files:
      - any-glob-to-any-file: "src/data/blog/**/*"

astro:
  - changed-files:
      - any-glob-to-any-file:
          - "src/pages/**/*"
          - "src/layouts/**/*"
          - "src/components/**/*"
          - "astro.config.ts"
          - "src/config.ts"

styles:
  - changed-files:
      - any-glob-to-any-file:
          - "src/styles/**/*"
          - "**/*.css"

typescript:
  - changed-files:
      - any-glob-to-any-file:
          - "tsconfig.json"
          - "src/**/*.ts"

config:
  - changed-files:
      - any-glob-to-any-file:
          - "src/config.ts"
          - "src/constants.ts"
          - "src/content.config.ts"
          - "src/tags.ts"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**/*"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "bun.lock"
          - "renovate.json"

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - "eslint.config.js"
          - ".prettierrc.mjs"
          - ".prettierignore"
          - "lefthook.yml"
          - "justfile"
          - "ruff.toml"
          - "scripts/**/*"

utils:
  - changed-files:
      - any-glob-to-any-file: "src/utils/**/*"

seo:
  - changed-files:
      - any-glob-to-any-file:
          - "src/layouts/Layout.astro"
          - "src/pages/robots.txt.ts"
