# Ruff lints and formats Python files only. Its defaults also format the code
# blocks inside Markdown, which would rewrite snippets in blog posts.
include = ["*.py"]
# Keep excluded files excluded when a hook passes them by name
force-exclude = true
extend-exclude = [
  # Ghost migration and content-maintenance helpers that predate the CLI contract
  "scripts/analyze_images.py",
  "scripts/check_image_links.py",
  "scripts/convert_frontmatter.py",
  "scripts/import_ghost_posts.py",
  "scripts/normalize-tags.py",
  "scripts/rename_to_kebab.py",
]
