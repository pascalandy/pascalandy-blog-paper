# Git hooks: every command is a just recipe, scoped by glob; jobs run in order.
# Docs: https://lefthook.dev
# Silent on success; a failing job replays its output
output:
  - failure

pre-commit:
  jobs:
    - name: gitleaks
      run: just gitleaks-staged
      fail_text: "A secret is staged, or gitleaks is missing (brew install gitleaks)"

    - name: format
      glob: "*.{astro,cjs,css,cts,js,json,jsx,md,mjs,mts,py,ts,tsx,yaml,yml}"
      run: just format {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{astro,cjs,cts,js,jsx,mjs,mts,py,ts,tsx}"
      run: just lint {staged_files}

    # Posts, the tag registry, or the schema changed: validate the content
    - name: content
      glob: "{src/data/blog/*.md,src/tags.ts,src/content.config.ts}"
      run: just check --only content

pre-push:
  jobs:
    - name: check
      run: just check
